<script>

const SC={
landing:()=>`${pub()}<section class="hero"><div><p class="eb">Student carpooling · Dehradun</p><h1>Ride with people <em>from your campus.</em></h1><p class="lead">Every driver and rider is a student whose ID a campus admin has reviewed. Share the commute, split the fuel, keep the platform out of your pocket.</p><div class="row"><button class="btn" data-go="find">Find a ride ${I("arrow")}</button><button class="btn sec" data-go="offer">Offer a ride</button></div></div>${stage()}</section>
<div class="wr"><div class="mq" aria-hidden="true"><span>${"Premnagar Chowk · Suddhowala Hub · Nanda Ki Chowki · UIT Gate 1 · Rajpur Road · ".repeat(8)}</span></div><div class="facts"><div><b>Reviewed</b><span class="mu">Every account is checked by a campus admin</span></div><div><b>₹0 markup</b><span class="mu">Fuel is split directly between students</span></div><div><b>Your corridor</b><span class="mu">Routes from your stop to your campus gate</span></div></div></div>

<section class="sec wr" style="display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center"><div><p class="eb">Sample morning rides</p><h2>See who is heading your way.</h2><p class="lead">Time, fare and driver are visible before you ask for a seat.</p><button class="btn" data-go="find">Browse rides</button></div><div class="stk" style="position:relative"><div class="bkk" style="inset:-14px -16px -8px -10px;background:var(--p2);transform:rotate(2deg);opacity:.95"></div>${RD.slice(0,3).map((r,i)=>`<div class="gl" style="margin-left:${[0,28,10][i]}px;margin-right:${[20,0,30][i]}px"><b class="t">${r[0]}</b><span style="flex:1"><b style="font-weight:700">Premnagar → UIT Gate 1</b><div class="mu">${r[2]}</div></span><b>₹${r[4]}</b></div>`).join("")}</div></section>

<section class="sec wr g2"><div><h2>Safety is mostly careful checks, done properly.</h2></div><div class="cd">${["ID reviewed by your campus","Trip shared with a contact you choose","Pickup code so you know it is the right car"].map(x=>`<p style="display:flex;gap:10px;padding:8px 0">${I("shield")}${x}</p>`).join("")}<button class="btn sec sm" data-go="safety" style="margin-top:8px">Safety information</button></div></section>
<div class="band"><div class="bkk" style="right:-30px;top:-40px;width:30%;height:190%;background:var(--p2);transform:rotate(8deg);opacity:.85"></div><div><h2 style="max-width:14em">Your 8:15 lecture will not wait.</h2><p style="margin-top:10px;opacity:.9">Sample ride today: 7:45 am · ₹25 per seat</p></div><button class="btn" data-go="register">Create your account</button></div>
<footer class="ft wr"><span>CampusRide · design prototype with sample data</span><span>Privacy · Terms · Contact campus team</span></footer>`,

<div class="row" role="group" aria-label="Filters" style="margin-bottom:18px">${[["w","Women only"],["e","Before 8:30"],["s","2+ seats"],["p","Under ₹30"]].map(c=>`<button class="chip" aria-pressed="${!!f[c[0]]}" data-act="f" data-k="${c[0]}">${c[1]}</button>`).join("")}</div>
<div class="g2"><div><div class="row" style="justify-content:space-between;margin-bottom:12px"><b aria-live="polite">${L.length} ride${L.length==1?"":"s"} found</b><label class="mu">Sort <select data-act="so" style="padding:6px;border-radius:8px;border:1.5px solid var(--line);background:var(--card)"><option value="t"${S.sort=="t"?" selected":""}>Earliest</option><option value="p"${S.sort=="p"?" selected":""}>Lowest fare</option></select></label></div>${L.length?L.map(([r,i])=>tk(r,i)).join(""):`<div class="cd" style="text-align:center;padding:40px"><h3>No rides match these filters</h3><p class="mu" style="margin:8px 0 16px">Try removing a filter or offer your own ride.</p><button class="btn sec" data-act="clr">Clear filters</button></div>`}</div><aside class="stage2"><div class="bkk" style="inset:14px -10px -10px 22px;background:var(--pri);transform:rotate(2deg)"></div><div class="gl" style="padding:20px"><h3>Your corridor</h3><p class="mu" style="margin:6px 0 10px">${ST[0]} to ${ST[3]}</p>${mini()}<ul class="tl" style="margin-top:14px">${ST.map((s,i)=>`<li${i==3?' class="end"':""}><div><b>${s}</b><div class="mu">${["7:45","7:52","8:04","8:15"][i]}</div></div></li>`).join("")}</ul></div></aside></div>`)},

></aside></div>`)},
login:()=>`${pub()}<div class="auth"><section class="ap"><p class="eb" style="color:var(--onpri);opacity:.8">Welcome back</p><h1 style="font-size:clamp(34px,4.5vw,54px)">Pick up where your commute left off.</h1><div class="stk" style="margin-top:28px;position:relative;max-width:420px">${RD.slice(0,3).map((r,i)=>`<div class="gl" style="margin-left:${[0,24,8][i]}px"><b class="t">${r[0]}</b><span style="flex:1"><b style="font-weight:700">Premnagar → UIT Gate 1</b><div class="mu">${r[2]}</div></span><b>₹${r[4]}</b></div>`).join("")}</div></section><section class="af"><h2>Student login</h2><p class="mu" style="margin:6px 0 20px">Use your campus email.</p><form id="lf" novalidate>${fld("Campus email","l-em","email","","you@university.edu")}<label class="f" id="f-l-pw">Password<span style="display:flex;gap:8px"><input id="l-pw" type="${S.pw?"text":"password"}" data-req="1" aria-describedby="e-l-pw"><button type="button" class="btn sec sm" data-act="pw" style="margin-top:6px">${S.pw?"Hide":"Show"}</button></span><span class="er" id="e-l-pw" role="alert"></span></label><div class="row" style="justify-content:space-between;margin-bottom:18px"><label class="mu"><input type="checkbox"> Keep me signed in</label><a href="#" class="mu" data-act="fg">Forgot password?</a></div><button class="btn" style="width:100%">Sign in</button></form><p class="mu" style="margin-top:18px;text-align:center">New here? <button class="lk" data-go="register" style="color:var(--acc)">Create an account</button> · <button class="lk" data-act="fl">Fill sample details</button></p></section></div>`,
